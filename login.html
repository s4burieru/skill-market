<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · SkillMarket</title>
  <meta
    name="description"
    content="Log in to SkillMarket to manage your projects, messages, proposals and job postings."
  />
  <link rel="icon" type="image/png" href="img/logo-2.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
</head>

<body id="top">

  <site-navbar></site-navbar>

  <main class="auth">
    <div class="container auth__inner">
      <section class="auth__card">
        <header class="auth__head">
          <h1 class="auth__title">Log in to your account</h1>
          <p class="auth__subtitle">
            Pick up where you left off: messages, proposals and projects, all in one place.
          </p>
        </header>

        <form class="form" data-form="login" novalidate>
          <div class="field">
            <label class="field__label" for="login-email">Email address</label>
            <input
              class="field__input"
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
            <p class="field__error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <div class="field__row">
              <label class="field__label" for="login-password">Password</label>
              <a class="text-link" href="#">Forgot password?</a>
            </div>
            <div class="field__control">
              <input
                class="field__input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
              />
              <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <p class="field__error" data-error-for="password" hidden></p>
          </div>

          <label class="check">
            <input type="checkbox" name="remember" />
            <span>Keep me signed in on this device</span>
          </label>

          <button class="btn btn--primary btn--block" type="submit">Log in</button>
        </form>

        <p class="auth__alt">
          New to SkillMarket?
          <a class="text-link" href="join.html">Create an account</a>
        </p>
      </section>
    </div>
  </main>

  <site-footer></site-footer>

  <div class="notice" id="notice" hidden role="alert"></div>

  <script src="js/data-bundle.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/pages/auth.js" defer></script>
</body>
</html>
