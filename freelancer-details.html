<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freelancer profile · SkillMarket</title>
  <meta
    name="description"
    content="Freelancer profile on SkillMarket: skills, hourly rate, availability, work history and reviews from previous clients."
  />
  <link rel="icon" type="image/png" href="img/logo-2.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages/detail.css" />
</head>

<body id="top">

  <site-navbar></site-navbar>

  <main>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <div class="container">
        <ol>
          <li><a href="freelancers.html">Find Freelancers</a></li>
          <li><a href="freelancers.html" data-crumb-parent>All freelancers</a></li>
          <li aria-current="page" data-crumb-current>Freelancer</li>
        </ol>
      </div>
    </nav>

    <section class="detail">
      <div class="container detail__grid" data-detail-root>
        <p class="empty-state">Loading profile…</p>
      </div>
    </section>

    <section class="section section--alt related" data-related-section hidden>
      <div class="container">
        <header class="section__head">
          <div>
            <h2 class="section__title">Similar freelancers</h2>
            <p class="section__subtitle">Other professionals with comparable skills</p>
          </div>
          <a class="text-link" href="freelancers.html">View all freelancers</a>
        </header>
        <div class="grid grid--cards" data-related></div>
      </div>
    </section>

    <section class="cta" id="get-started">
      <div class="container cta__inner" data-cta></div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/data-bundle.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/pages/freelancer-details.js" defer></script>
</body>
</html>
