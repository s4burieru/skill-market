<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explore Services · SkillMarket</title>
  <meta
    name="description"
    content="Explore every service on SkillMarket: development, marketing, design, writing and more, with ratings, prices and reviews."
  />
  <link rel="icon" type="image/png" href="img/logo-2.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages/browse.css" />
</head>

<body id="top" data-browse="services">

  <site-navbar></site-navbar>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="badge badge--soft">Explore the marketplace</span>
        <h1 class="page-hero__title">Find the right service for any project</h1>
        <p class="page-hero__desc">
          Browse verified freelancers across development, marketing, design and more.
          Every listing shows real ratings, transparent pricing and reviews from past clients.
        </p>

        <form class="search" data-browse-form role="search">
          <span class="search__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.4 3.2a7.2 7.2 0 1 1 0 14.4 7.2 7.2 0 0 1 0-14.4Zm0 2.5a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4Z"/><rect x="13.85" y="16.3" width="7.5" height="2.6" rx="1.3" transform="rotate(45 17.6 17.6)"/></svg>
          </span>
          <label class="sr-only" for="explore-search">Search services</label>
          <input
            class="search__input"
            id="explore-search"
            name="q"
            type="search"
            data-browse-input
            autocomplete="off"
            placeholder="What service are you looking for?"
          />
          <button class="btn btn--primary search__btn" type="submit">Search</button>
        </form>
      </div>
    </section>

    <section class="section browse" id="results">
      <div class="container">
        <div class="browse__bar">
          <div class="pills" data-browse-pills></div>
          <p class="browse__count" data-browse-count aria-live="polite"></p>
        </div>

        <div class="grid grid--cards" data-browse-grid></div>
        <p class="empty-state" data-browse-empty hidden>
          No services match your search. Try a different keyword or category.
        </p>
      </div>
    </section>

  </main>

  <site-footer></site-footer>

  <script src="js/data-bundle.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/reveal.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/pages/browse.js" defer></script>
</body>
</html>
