<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join · SkillMarket</title>
  <meta
    name="description"
    content="Create a SkillMarket account. Join as a freelancer to offer your skills or hire talent for your next project."
  />
  <link rel="icon" type="image/png" href="img/logo-2.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
</head>

<body id="top">

  <site-navbar></site-navbar>

  <main class="auth">
    <div class="container auth__inner">
      <section class="auth__card">
        <header class="auth__head">
          <h1 class="auth__title">Create your account</h1>
          <p class="auth__subtitle">
            Tell us how you plan to use SkillMarket. You can switch account types later.
          </p>
        </header>

        <form class="form" data-form="join" novalidate>
          <div class="field" role="radiogroup" aria-labelledby="account-type-label">
            <span class="field__label" id="account-type-label">Choose account type</span>
            <div class="account-types">
              <label class="account-type">
                <input class="account-type__input" type="radio" name="accountType" value="freelancer" />
                <span class="account-type__body">
                  <span class="account-type__head">
                    <span class="account-type__icon" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.6" r="4.1"/><path d="M4.5 20.4a7.5 7.5 0 0 1 15 0 1.2 1.2 0 0 1-1.2 1.5H5.7a1.2 1.2 0 0 1-1.2-1.5Z"/></svg>
                    </span>
                    <span class="account-type__check" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 6.3a1.5 1.5 0 0 1 .15 2.1l-9.2 10.6a1.5 1.5 0 0 1-2.25.08L3.6 12.9a1.5 1.5 0 0 1 2.2-2l4 4.3L17.8 6a1.5 1.5 0 0 1 2.2.3Z"/></svg>
                    </span>
                  </span>
                  <span class="account-type__text">
                    <span class="account-type__title">Freelancer</span>
                    <span class="account-type__desc">Offer your skills, build your profile and get hired.</span>
                  </span>
                </span>
              </label>

              <label class="account-type">
                <input class="account-type__input" type="radio" name="accountType" value="hire-talent" />
                <span class="account-type__body">
                  <span class="account-type__head">
                    <span class="account-type__icon" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9.3" cy="8.2" r="3.4"/><path d="M3.4 19.6a6 6 0 0 1 11.8 0 1.1 1.1 0 0 1-1.1 1.4H4.5a1.1 1.1 0 0 1-1.1-1.4Z"/><circle cx="16.7" cy="9" r="2.7" fill-opacity=".55"/><path fill-opacity=".55" d="M15.3 14.2a6 6 0 0 1 5 6.35 1.15 1.15 0 0 1-1.2 1.15h-2.5a7.4 7.4 0 0 0-1.3-7.5Z"/></svg>
                    </span>
                    <span class="account-type__check" aria-hidden="true">
                      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 6.3a1.5 1.5 0 0 1 .15 2.1l-9.2 10.6a1.5 1.5 0 0 1-2.25.08L3.6 12.9a1.5 1.5 0 0 1 2.2-2l4 4.3L17.8 6a1.5 1.5 0 0 1 2.2.3Z"/></svg>
                    </span>
                  </span>
                  <span class="account-type__text">
                    <span class="account-type__title">Hire talent</span>
                    <span class="account-type__desc">Post jobs and hire skilled professionals for your projects.</span>
                  </span>
                </span>
              </label>
            </div>
            <p class="field__error" data-error-for="accountType" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="join-name">Full name</label>
            <input
              class="field__input"
              id="join-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="e.g. Sarah Jenkins"
            />
            <p class="field__error" data-error-for="name" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="join-email">Email address</label>
            <input
              class="field__input"
              id="join-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
            <p class="field__error" data-error-for="email" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="join-password">Password</label>
            <div class="field__control">
              <input
                class="field__input"
                id="join-password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="At least 8 characters"
              />
              <button class="field__toggle" type="button" data-toggle-password aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 5.5c5.5 0 8.9 4.7 9.8 6.5-.9 1.8-4.3 6.5-9.8 6.5S3.1 13.8 2.2 12c.9-1.8 4.3-6.5 9.8-6.5Zm0 2.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Z"/></svg>
              </button>
            </div>
            <div class="strength" data-strength hidden>
              <div class="strength__track">
                <div class="strength__fill" data-strength-fill></div>
              </div>
              <span class="strength__label" data-strength-label></span>
            </div>
            <p class="field__error" data-error-for="password" hidden></p>
          </div>

          <div class="field">
            <label class="check" data-terms>
              <input type="checkbox" name="terms" />
              <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
            </label>
            <p class="field__error" data-error-for="terms" hidden></p>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Create account</button>
        </form>

        <p class="auth__alt">
          Already have an account?
          <a class="text-link" href="login.html">Log in</a>
        </p>
      </section>
    </div>
  </main>

  <site-footer></site-footer>

  <script src="js/data-bundle.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/reveal.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/pages/auth.js" defer></script>
</body>
</html>
