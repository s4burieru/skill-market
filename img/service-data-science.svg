<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Data Analysis and Dashboards">
  <defs>
    <linearGradient id="bgData" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgData)"/>
  <circle cx="110" cy="80" r="150" fill="#38bdf8" opacity="0.16"/>
  <circle cx="700" cy="440" r="160" fill="#1dbf73" opacity="0.14"/>

  <!-- dashboard panels -->
  <rect x="110" y="90" width="330" height="150" rx="16" fill="#ffffff" opacity="0.12"/>
  <rect x="460" y="90" width="230" height="150" rx="16" fill="#ffffff" opacity="0.12"/>
  <rect x="110" y="262" width="580" height="150" rx="16" fill="#ffffff" opacity="0.12"/>

  <!-- donut -->
  <g transform="translate(215 165)">
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="18"/>
    <circle r="52" fill="none" stroke="#1dbf73" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="204 327" transform="rotate(-90)"/>
    <circle r="52" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="70 327" transform="rotate(130)"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <rect x="300" y="132" width="106" height="12" rx="6"/>
    <rect x="300" y="158" width="76" height="12" rx="6" fill-opacity="0.55"/>
    <rect x="300" y="184" width="92" height="12" rx="6" fill-opacity="0.55"/>
  </g>

  <!-- KPI numbers -->
  <g fill="#a5f3fc">
    <rect x="490" y="126" width="120" height="26" rx="8"/>
    <rect x="490" y="166" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="490" y="192" width="140" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- line chart -->
  <path d="M150 372l80-42 76 30 84-64 82 34 90-58 100 40" fill="none" stroke="#1dbf73"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 386l80-24 76 14 84-30 82 16 90-26 100 18" fill="none" stroke="#38bdf8"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <g fill="#ffffff">
    <circle cx="306" cy="360" r="7"/>
    <circle cx="472" cy="330" r="7"/>
    <circle cx="642" cy="310" r="7"/>
  </g>
</svg>
